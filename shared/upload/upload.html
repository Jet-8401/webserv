<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Files - Webserv</title>
    <style>
	    :root {
	        --primary-color: #4361ee;
	        --hover-color: #3046b1;
	        --bg-color: #f0f2f5;
	        --text-color: #1a1c24;
	        --card-bg: linear-gradient(135deg, #ffffff, #f2f4f7);
	        --shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
	    }

	    body {
	        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
	        max-width: 1200px;
	        margin: 0 auto;
	        padding: 40px 20px;
	        background-color: var(--bg-color);
	        color: var(--text-color);
	    }

	    .header-bar {
	        display: flex;
	        justify-content: space-between;
	        align-items: center;
	        padding: 20px 30px;
	        background: var(--card-bg);
	        border-radius: 20px;
	        box-shadow: var(--shadow);
	        margin-bottom: 30px;
	    }

	    .header-bar h1 {
	        margin: 0;
	        color: var(--text-color);
	        font-size: 2em;
	        font-weight: 700;
	    }

	    .nav-button {
	        background: var(--card-bg);
	        border: 2px solid transparent;
	        padding: 15px 25px;
	        border-radius: 15px;
	        box-shadow: var(--shadow);
	        cursor: pointer;
	        transition: all 0.3s ease;
	        text-decoration: none;
	        color: var(--text-color);
	        display: flex;
	        align-items: center;
	        gap: 10px;
	    }

	    .nav-button:hover {
	        transform: translateY(-5px);
	        border: 2px solid var(--primary-color);
	        background: #ffffff;
	    }

	    .nav-button i {
	        font-size: 20px;
	        color: var(--primary-color);
	    }

	    .upload-container {
	        background: var(--card-bg);
	        border-radius: 20px;
	        padding: 40px;
	        margin-top: 30px;
	        box-shadow: var(--shadow);
	        text-align: center;
	        display: flex;
	        flex-direction: column;
	        align-items: center;
	    }

		.upload-container form {
		    width: 100%;
		    max-width: 800px; /* Increased max-width to accommodate both buttons */
		    display: flex;
		    flex-direction: row; /* Changed from column to row */
		    gap: 20px;
		    justify-content: center;
		}

	    .upload-container input[type="file"] {
	        display: none;
	    }

		.upload-container label,
		.upload-container button {
		    background: var(--primary-color);
		    color: white;
		    padding: 20px 40px;
		    border-radius: 15px;
		    cursor: pointer;
		    transition: all 0.3s ease;
		    font-weight: 500;
		    font-size: 1.2em;
		    width: 250px; /* Fixed width instead of 100% */
		    border: none;
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    gap: 10px;
		}

	    .upload-container label:hover,
	    .upload-container button:hover {
	        transform: translateY(-3px);
	        background: var(--hover-color);
	        box-shadow: var(--shadow);
	    }

	    .upload-container label i,
	    .upload-container button i {
	        font-size: 1.2em;
	    }

	    .message {
	        margin-top: 20px;
	        font-size: 18px;
	        display: none;
	        padding: 15px;
	        border-radius: 10px;
	        transition: all 0.3s ease;
	        width: 100%;
	        max-width: 400px;
	    }

	    .message i {
	        margin-right: 10px;
	    }

	    .message.success {
	        background: rgba(67, 97, 238, 0.1);
	        color: var(--primary-color);
	    }

	    .message.error {
	        background: rgba(231, 76, 60, 0.1);
	        color: #e74c3c;
	    }

	    .progress-bar {
	        width: 100%;
	        max-width: 400px;
	        background-color: rgba(67, 97, 238, 0.1);
	        border-radius: 10px;
	        overflow: hidden;
	        margin-top: 20px;
	        display: none;
	    }

	    .progress-bar-inner {
	        height: 10px;
	        width: 0;
	        background: var(--primary-color);
	        transition: width 0.3s ease;
	    }

	    .file-name {
	        margin-top: 15px;
	        font-size: 16px;
	        color: var(--text-color);
	        display: none;
	        padding: 10px;
	        background: rgba(67, 97, 238, 0.1);
	        border-radius: 10px;
	        word-break: break-all;
	        width: 100%;
	        max-width: 400px;
	    }

		@media (max-width: 768px) {
		    .upload-container form {
		        flex-direction: column; /* Stack buttons on mobile */
		        max-width: 400px;
		    }

		    .upload-container label,
		    .upload-container button {
		        width: 100%; /* Full width on mobile */
		    }
		}
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="header-bar">
        <h1>Upload Files</h1>
        <a href="/" class="nav-button">
            <i class="fas fa-home"></i>
            Back to Home
        </a>
    </div>

    <div class="upload-container">
        <form id="uploadForm" action="/files" method="post" enctype="multipart/form-data">
            <input type="file" id="fileInput" name="file">
            <label for="fileInput">
                <i class="fas fa-upload"></i> Choose File
            </label>
            <button type="submit">
                <i class="fas fa-cloud-upload-alt"></i> Upload
            </button>
        </form>
        <div class="file-name" id="fileName"></div>
        <div class="progress-bar" id="progressBar">
            <div class="progress-bar-inner" id="progressBarInner"></div>
        </div>
        <div class="message success" id="successMessage">
            <i class="fas fa-check-circle"></i> File uploaded successfully!
        </div>
        <div class="message error" id="errorMessage">
            <i class="fas fa-times-circle"></i> There was an error uploading the file.
        </div>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', function() {
            const fileName = this.files[0] ? this.files[0].name : '';
            document.getElementById('fileName').textContent = fileName ? `Selected file: ${fileName}` : '';
            document.getElementById('fileName').style.display = fileName ? 'block' : 'none';
        });

        document.getElementById('uploadForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            const xhr = new XMLHttpRequest();

            xhr.open('POST', '/files', true);

            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 100;
                    document.getElementById('progressBar').style.display = 'block';
                    document.getElementById('progressBarInner').style.width = percentComplete + '%';
                }
            });

            xhr.onload = function() {
                console.log(xhr.status);
                if (xhr.status >= 200 && xhr.status < 300) {
                    document.getElementById('successMessage').style.display = 'block';
                    document.getElementById('errorMessage').style.display = 'none';
                } else {
                    document.getElementById('successMessage').style.display = 'none';
                    document.getElementById('errorMessage').style.display = 'block';
                }
                document.getElementById('progressBar').style.display = 'none';
                document.getElementById('progressBarInner').style.width = '0';
            };

            xhr.onerror = function() {
                document.getElementById('successMessage').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('progressBar').style.display = 'none';
                document.getElementById('progressBarInner').style.width = '0';
            };

            xhr.send(formData);
        });
    </script>
</body>
</html>
