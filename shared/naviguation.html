<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv Navigation</title>
    <style>
	    :root {
	        --primary-color: #4361ee;
	        --hover-color: #3046b1;
	        --bg-color: #f0f2f5;
	        --text-color: #1a1c24;
	        --card-bg: linear-gradient(135deg, #ffffff, #f2f4f7);
	        --shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
	    }

	    body {
	        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
	        max-width: 1200px;
	        margin: 0 auto;
	        padding: 40px 20px;
	        background-color: var(--bg-color);
	        color: var(--text-color);
	    }

	    h1 {
	        color: var(--text-color);
	        text-align: center;
	        padding: 30px;
	        background: var(--card-bg);
	        border-radius: 20px;
	        box-shadow: var(--shadow);
	        margin-bottom: 40px;
	        font-size: 2.5em;
	        font-weight: 700;
	    }

	    .nav-container {
	        display: grid;
	        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
	        gap: 25px;
	        margin-top: 30px;
	    }

	    .nav-button {
	        background: var(--card-bg);
	        border: 2px solid transparent;
	        padding: 25px;
	        border-radius: 15px;
	        box-shadow: var(--shadow);
	        cursor: pointer;
	        transition: all 0.3s ease;
	        text-decoration: none;
	        color: var(--text-color);
	        text-align: center;
	        display: flex;
	        flex-direction: column;
	        align-items: center;
	        justify-content: center;
	    }

	    .nav-button:hover {
	        transform: translateY(-5px);
	        border: 2px solid var(--primary-color);
	        background: #ffffff;
	    }

	    .nav-button i {
	        font-size: 32px;
	        margin-bottom: 15px;
	        color: var(--primary-color);
	    }

	    .nav-button span {
	        font-size: 1.1em;
	        font-weight: 500;
	    }

	    .file-list {
	        background: var(--card-bg);
	        border-radius: 20px;
	        padding: 30px;
	        margin-top: 40px;
	        box-shadow: var(--shadow);
	    }

	    .file-list h2 {
	        margin-top: 0;
	        color: var(--text-color);
	        font-size: 1.8em;
	        margin-bottom: 20px;
	        border-bottom: 2px solid #e1e4e8;
	        padding-bottom: 10px;
	    }

	    .file-list ul {
	        list-style: none;
	        padding: 0;
	    }

	    .file-list li {
	        padding: 15px;
	        border-bottom: 1px solid #e1e4e8;
	        transition: background-color 0.2s;
	        display: flex;
	        align-items: center;
	    }

	    .file-list li:hover {
	        background-color: rgba(67, 97, 238, 0.05);
	    }

	    .file-list li:last-child {
	        border-bottom: none;
	    }

	    .file-list i {
	        margin-right: 15px;
	        color: var(--primary-color);
	    }

	    .file-list a {
	        text-decoration: none;
	        color: var(--text-color);
	        font-weight: 500;
	    }

	    .file-list a:hover {
	        color: var(--primary-color);
	    }

	    @media (max-width: 768px) {
	        body {
	            padding: 20px 10px;
	        }

	        h1 {
	            font-size: 2em;
	            padding: 20px;
	        }
	    }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <h1>Webserv Navigation</h1>

    <div class="nav-container">
        <a href="/" class="nav-button">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="/upload" class="nav-button">
            <i class="fas fa-upload"></i>
            <span>Upload Files</span>
        </a>
        <a href="/cgi-bin/" class="nav-button">
            <i class="fas fa-code"></i>
            <span>CGI Scripts</span>
        </a>
    </div>

    <div class="file-list">
        <h2>Available Files</h2>
        <ul>
       		<li><i class="fas fa-bug"></i><a href="/files/hack.sh">hack.sh</a></li>
        	<li><i class="fas fa-file-code"></i><a href="/files/cgi code.txt">cgi code.txt</a></li>
            <li><i class="fas fa-folder"></i><a href="/files">Uploaded Files</a></li>
        </ul>
    </div>

</body>
</html>
