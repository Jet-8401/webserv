<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Error - Webserv</title>
    <style>
        :root {
            --primary-color: #4361ee;
            --hover-color: #3046b1;
            --bg-color: #f0f2f5;
            --text-color: #1a1c24;
            --card-bg: linear-gradient(135deg, #ffffff, #f2f4f7);
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .error-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            margin-top: 50px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .error-code {
            font-size: 72px;
            color: var(--primary-color);
            margin: 0;
            font-weight: 700;
        }

        .error-message {
            font-size: 28px;
            color: var(--text-color);
            margin: 20px 0;
            font-weight: 600;
        }

        .error-description {
            color: var(--text-color);
            margin-bottom: 30px;
            font-size: 1.1em;
            opacity: 0.8;
        }

        .nav-button {
            background: var(--card-bg);
            border: 2px solid transparent;
            padding: 15px 30px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-color);
            display: inline-flex;
            align-items: center;
            font-weight: 500;
        }

        .nav-button:hover {
            transform: translateY(-5px);
            border: 2px solid var(--primary-color);
            background: #ffffff;
        }

        .nav-button i {
            margin-right: 10px;
            color: var(--primary-color);
        }

        .error-icon {
            font-size: 64px;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            .error-container {
                padding: 20px;
            }

            .error-code {
                font-size: 48px;
            }

            .error-message {
                font-size: 24px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="error-container">
        <i class="fas fa-exclamation-circle error-icon"></i>
        <h1 class="error-code" id="errorCode">404</h1>
        <h2 class="error-message" id="errorMessage">Page Not Found</h2>
        <p class="error-description" id="errorDescription">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="/" class="nav-button">
            <i class="fas fa-home"></i>
            Back to Home
        </a>
    </div>
</body>
</html>
