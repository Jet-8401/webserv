http
{
	server
	{
		listen 0.0.0.0:5500;
		server_name webserv.42.fr;
		root ~/Projects/webserv/shared;
		max_connections 2048;
		autoindex on;
		error_page 404 405 error/404.html;

		location /
		{
			index naviguation.html;
		}

		location /alias
		{
			alias files;
		}

		location /files/
		{
			index upload.html;
			client_max_body_size 10M;
			methods GET POST DELETE;
		}

		location /cgi-bin
		{
			client_max_body_size 500;
			cgi .php /usr/bin/php;
			cgi .js /usr/bin/node;
			cgi .sh /bin/bash;
			methods GET POST;
		}

		location /upload
		{
			index upload.html;
		}
	}
}
